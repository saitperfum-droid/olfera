<div class="header-actions"><button class="cart-btn" id="cart-btn" aria-label="Кошик"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 01-8 0"></path></svg><span class="cart-count" id="cart-count">0</span></button><button class="menu-toggle" aria-label="Меню"><span></span><span></span><span></span></button></div></div></header>

<div class="order-fields">
<input id="order-name" placeholder="Ім'я" autocomplete="name">
<input id="order-phone" placeholder="Телефон, напр. 096..." inputmode="tel" autocomplete="tel">
<select id="order-delivery"><option value="Самовивіз, Європейська 6/5">Самовивіз, Європейська 6/5</option><option value="Нова Пошта">Нова Пошта</option></select>

</div>
<button class="btn btn-gold cart-order-btn" id="cart-order-btn">Замовити в Telegram</button>
<button class="btn btn-outline cart-order-btn" id="cart-ig-btn">Замовити в Instagram</button>
<button class="btn btn-outline cart-order-btn" id="cart-wa-btn">Замовити в WhatsApp</button><p class="order-hint" id="order-hint"></p></div></aside>

<section class="section catalog page-top" id="catalog">
  <div class="container">
    <h1 class="section-title">Каталог</h1>
    <p class="section-subtitle">Оберіть аромат і кількість мілілітрів</p>
    <div class="filter-bar">
      <input id="search-input" placeholder="Пошук...">
      <select id="brand-filter"><option value="">Усі бренди</option></select>
      <select id="price-filter">
        <option value="">Будь-яка ціна</option>
        <option value="0-100">до 100 ₴</option>
        <option value="100-200">100–200 ₴</option>
        <option value="200-500">200–500 ₴</option>
      </select>

      <span id="filter-count"></span>

    <div class="catalog-pager" id="catalog-pager"></div>
  </div>
